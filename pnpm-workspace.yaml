packages:
  - apps/*
  - packages/*
  - fixtures/*

# Electron Forge 7.11.2 pulls its official @electron/node-gyp fork from Git.
blockExoticSubdeps: false

overrides:
  fast-uri: 3.1.4
  fast-xml-builder: 1.1.7
  form-data: 4.0.6
  hono: 4.12.27
  protobufjs: 7.6.5
  sharp: 0.35.0
  ws: 8.21.0

allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  bufferutil: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  libxmljs2: false
  macos-alias: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.113.0'
  - '@vitejs/plugin-react@6.0.4'

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
  - fs-xattr
  - macos-alias
  - sharp

nodeLinker: hoisted
